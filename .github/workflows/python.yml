name: Python PoC
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests (no PM5 hardware required)
        run: python -m unittest discover -v
      - name: Check Python syntax
        run: python -m compileall -q pm5_probe.py test_pm5_probe.py
